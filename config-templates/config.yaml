# Hermes Agent config — template for fresh install.
# This file is auto-synced from proxy/config.json by sync_hermes_config.py.
# Only edit manually for platform tokens (Telegram, Discord) and non-model settings.
#
# IMPORTANT: Secrets belong in .env, not here.
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  STACK INFO (для справки)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  Основная модель: MiMo V2.5 Free (Xiaomi) через OpenCode Proxy :9224
#  Vision: MiMo V2.5 Free — та же модель что и текстовая. Она же анализирует
#          изображения, код, скриншоты, документы. Отдельный vision НЕ НУЖЕН.
#
#  Порты:
#    :9224  — OpenCode Proxy (главный мозг, текст + vision + reasoning)
#    :9225  — Vision Fallback (MiMo → Ollama, только если :9224 недоступен)
#    :8888  — SearXNG (локальный поиск в интернете)
#    :11434 — Ollama (локальные модели, fallback для vision)
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

model:
  default: opencode
  provider: custom
  base_url: http://127.0.0.1:9224/v1
  context_length: 200000
  api_key: no-key-required
  max_tokens: 32768
  model: opencode
providers:
  custom:
    base_url: http://127.0.0.1:9224/v1
    api_key: no-key-required
    models:
      opencode:
        context_length: 200000
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: ""  # Set GROQ_API_KEY in .env
  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key: ""  # Set CEREBRAS_API_KEY in .env
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ""  # Set GOOGLE_API_KEY in .env
  mistral:
    base_url: https://api.mistral.ai/v1
    api_key: ""  # Set MISTRAL_API_KEY in .env
fallback_providers: []
toolsets:
- hermes-cli
- web
- file
max_live_sessions: 16
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ''
  coding_context: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  platforms:
    telegram:
      enabled: true
      bot_token: ""  # Set TELEGRAM_BOT_TOKEN in .env
      allowed_chats: []  # Add your chat ID
      reactions: false
      streaming: true
      command_timeout: 1800
      max_turns: 20
  reasoning_effort: xhigh
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 180
  daemon_term_grace_seconds: 2
  env_passthrough: []
  home_mode: auto
  shell_init_files: []
  auto_source_bashrc: true
  persistent_shell: true
  working_dir: C:\\AI\\ecc-final
web:
  backend: searxng
  search_backend: searxng
  extract_backend: webstack
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: true
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
  dialog_timeout_s: 300
checkpoints:
  enabled: false
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
  delete_orphans: true
file_read_max_chars: 100000
mcp_discovery_timeout: 1.5
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 5000
  protect_first_n: 3
  abort_on_summary_failure: false
  codex_gpt55_autoraise: true
  in_place: true
prompt_caching:
  cache_ttl: 5m
openrouter:
  response_cache: true
  response_cache_ttl: 300
  min_coding_score: 0.65
auxiliary:
  vision:
    provider: custom
    model: mimo-v2.5-free
    base_url: http://127.0.0.1:9225/v1
    api_key: no-key-required
    timeout: 120
    download_timeout: 30
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #  VISION NOTE:
    #  Основная модель (MiMo V2.5 Free через :9224) уже распознаёт
    #  изображения. Вспомогательный vision (:9225) используется ТОЛЬКО
    #  когда основной прокси недоступен (fallback).
    #  Вручную вызывать vision_analyze НЕ нужно — основная модель сама
    #  анализирует любые картинки, скриншоты, документы.
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  web_extract:
