# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  STT FIX: language = "" (auto-detect)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Дефолт "en" заставляет Whisper распознавать ТОЛЬКО английскую речь.
#  Пустая строка = авто-определение языка для каждого сегмента.
#  Результат: русская речь → русский текст, английская → английский.
#  НЕ СТАВЬТЕ "en" — ломает русскую речь!
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
